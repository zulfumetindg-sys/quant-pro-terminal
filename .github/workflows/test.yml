name: QUANT PRO regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/signal-identity]

jobs:
  strategy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run deterministic strategy tests
        run: npm test
