name: QUANT PRO regression tests

on:
  push:
    branches: [main, feature/mobile-signal-alerts]
  pull_request:
    branches: [main, feature/signal-identity]

jobs:
  strategy-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify Web Push dependency
        run: node -e "require('web-push')"
      - name: Run deterministic strategy tests
        run: npm test
